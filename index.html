
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaySocial</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fa;font-family:Arial,sans-serif;color:#202331}
header{background:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#6554d9}
main{max-width:550px;margin:auto;padding:15px}
.card{background:white;padding:16px;border-radius:14px;margin-bottom:15px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:8px 0}
button{background:#6554d9;color:white;border:0;padding:11px 16px;border-radius:9px;cursor:pointer}
.post img{width:100%;border-radius:10px;margin-top:10px}
nav{position:sticky;bottom:0;background:white;padding:16px;display:flex;justify-content:space-around}
nav a{color:#6554d9;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<header>
<div class="logo">KaySocial 🌍</div>
<div>🔔 👤</div>
</header>

<main>
<div class="card">
<h2>Welcome to KaySocial!</h2>
<p>Connect. Share. Discover.</p>
<input id="postText" placeholder="What's happening today?">
<button onclick="addPost()">Share Post</button>
</div>

<div id="feed">
<div class="card post">
<h3>🌍 KaySocial Community</h3>
<p>Welcome to your new social space!</p>
<p>❤️ <span>12</span> Likes</p>
<button onclick="likePost(this)">Like ❤️</button>
</div>
<div class="card post">
<h3>🚀 Technology Lovers</h3>
<p>Share your ideas, interests and discoveries with the world.</p>
<p>❤️ <span>8</span> Likes</p>
<button onclick="likePost(this)">Like ❤️</button>
</div>
</div>
</main>

<nav>
<a href="#">Home</a>
<a href="#feed">Explore</a>
<a href="#postText">Create</a>
<a href="#">Profile</a>
</nav>

<script>
function likePost(button){
let count=button.previousElementSibling.querySelector("span");
count.textContent=Number(count.textContent)+1;
button.textContent="Liked ❤️";
button.disabled=true;
}

function addPost(){
let input=document.getElementById("postText");
if(!input.value.trim())return;
let post=document.createElement("div");
post.className="card post";
post.innerHTML="<h3>👤 KaySocial Member</h3><p></p><p>❤️ <span>0</span> Likes</p><button onclick='likePost(this)'>Like ❤️</button>";
post.querySelector("p").textContent=input.value;
document.getElementById("feed").prepend(post);
input.value="";
}
</script>
</body>
</html>
